<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b2f68">
<title>ONE SOUL — LUDO</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#071b3b;color:#fff}
button{font:inherit}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:flex}

#splash{
align-items:center;justify-content:center;text-align:center;overflow:hidden;
background:radial-gradient(circle at 15% 25%,rgba(47,214,255,.28),transparent 28%),
radial-gradient(circle at 85% 30%,rgba(126,77,255,.30),transparent 30%),
linear-gradient(145deg,#061a3c,#0c3f7b 52%,#1e1b58)
}
.splash-glow{position:absolute;width:70vw;height:70vw;border-radius:50%;background:rgba(60,215,255,.10);filter:blur(35px)}
.splash-logo{position:relative;font-size:clamp(65px,20vw,150px);font-weight:1000;letter-spacing:-7px;line-height:.78;text-shadow:0 7px 0 #075ca7,0 13px 25px rgba(0,0,0,.55)}
.splash-logo .one{display:block;color:#fff;font-size:.68em}
.splash-logo .soul{display:block;color:#5de7ff}
.splash-logo:after{content:"";display:block;width:75%;height:8px;margin:22px auto 0;border-radius:20px;background:linear-gradient(90deg,#29d9ff,#fff,#855cff);box-shadow:0 0 22px #52dfff}
.splash-sub{position:relative;margin-top:26px;font-weight:900;letter-spacing:4px;color:#d9f7ff}
.loading{position:absolute;bottom:9%;width:190px;height:7px;background:#16315a;border-radius:20px;overflow:hidden}
.loading i{display:block;width:40%;height:100%;background:#4ee4ff;border-radius:20px;animation:loading 1.5s infinite}
@keyframes loading{from{transform:translateX(-120%)}to{transform:translateX(500%)}}

#home{flex-direction:column;overflow:auto;background:radial-gradient(circle at 10% 15%,rgba(0,211,255,.16),transparent 25%),radial-gradient(circle at 90% 15%,rgba(111,83,255,.18),transparent 27%),linear-gradient(160deg,#08275a 0%,#0b56a7 52%,#081e49 100%)}
.topbar{height:70px;min-height:70px;display:flex;align-items:center;justify-content:space-between;padding:8px 13px;background:rgba(3,17,44,.80);border-bottom:1px solid rgba(255,255,255,.12)}
.brand{font-size:25px;font-weight:1000;letter-spacing:-1px}.brand b{color:#51e2ff}
.wallet{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:900}.wallet span{background:#112e5b;border:1px solid #33598b;padding:8px 10px;border-radius:16px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffdb53,#ff5b72);border:2px solid #fff}
.home{width:min(94vw,610px);margin:auto;padding:14px 0 28px}
.hero{text-align:center;padding:12px 0 20px}.hero h1{margin:0;font-size:clamp(39px,11vw,68px);letter-spacing:-4px;text-shadow:0 5px 0 #075ca7,0 10px 18px rgba(0,0,0,.35)}.hero h1 span{color:#5ae4ff}.hero p{margin:5px 0 0;color:#c4edff;font-weight:800}
.games{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.game{height:215px;border:0;border-radius:22px;overflow:hidden;color:#fff;position:relative;border:2px solid rgba(255,255,255,.35);box-shadow:0 9px 20px rgba(0,0,0,.38);cursor:pointer}.game:active{transform:scale(.985)}
.g-ludo{background:linear-gradient(145deg,#16a9ff,#0754c9 65%,#183d9b)}.g-card{background:linear-gradient(145deg,#2bc5ff,#1854c8)}.g-snake{background:linear-gradient(145deg,#32d08b,#0762ad)}.g-more{background:linear-gradient(145deg,#7b61ff,#282b9c)}
.art{height:150px;display:grid;place-items:center}.card-title{position:absolute;bottom:10px;left:12px;right:12px;text-align:left;font-size:25px;font-weight:1000;text-shadow:0 3px 0 rgba(0,0,0,.45)}
.mini-board{width:115px;height:115px;background:#fff;border:5px solid #193353;display:grid;grid-template-columns:repeat(3,1fr);transform:rotate(-4deg);box-shadow:0 6px 10px rgba(0,0,0,.3)}
.mini-board i:nth-child(1){background:#ef454e}.mini-board i:nth-child(2){background:#fff}.mini-board i:nth-child(3){background:#24b86a}.mini-board i:nth-child(4){background:#f3c633}.mini-board i:nth-child(5),.mini-board i:nth-child(6),.mini-board i:nth-child(7),.mini-board i:nth-child(8){background:#fff}.mini-board i:nth-child(9){background:#2b63db}
.cards{display:flex;transform:rotate(-8deg)}.cards i{width:48px;height:76px;background:#fff;border:3px solid #16335c;border-radius:8px;margin-left:-8px;display:grid;place-items:center;font-size:22px;font-weight:1000;color:#ef454e}.cards i:nth-child(2){color:#23aa5c;transform:translateY(-8px)}.cards i:nth-child(3){color:#2d62db;transform:translateY(4px)}
.snake{font-size:82px;filter:drop-shadow(0 6px 5px rgba(0,0,0,.35))}.more{font-size:72px}
.online{text-align:center;margin-top:18px;padding:13px;border-radius:17px;background:rgba(0,0,0,.18);font-weight:900}
.start{display:block;margin:16px auto 0;border:0;border-radius:17px;padding:14px 34px;color:#fff;font-size:19px;font-weight:1000;background:linear-gradient(#52efa0,#10a760);box-shadow:0 5px 0 #08733f}.note{text-align:center;color:#b9d8f5;font-size:11px;margin-top:12px}

#ludo{flex-direction:column;background:#071a3b}
.lhead{height:62px;min-height:62px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#0c2d5e;border-bottom:1px solid #345987}
.back{border:0;border-radius:12px;padding:9px 12px;background:#173f75;color:#fff;font-weight:1000}.turn{font-weight:1000;font-size:14px}.dice-small{font-size:28px;background:#fff;color:#111;border-radius:10px;padding:3px 9px}
.player-strip{height:64px;min-height:64px;display:flex;justify-content:space-around;align-items:center;background:#081f46;border-bottom:1px solid #315a8d;padding:4px 8px;gap:5px}
.player-card{display:flex;align-items:center;gap:5px;min-width:0;position:relative}
.dp{width:42px;height:42px;border-radius:50%;border:3px solid #fff;background:#173b68;display:grid;place-items:center;overflow:hidden;position:relative;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.dp img{width:100%;height:100%;object-fit:cover;display:none}.dp.empty:after{content:"+";font-size:25px;color:#ccecff;font-weight:900}
.player-name{font-size:10px;font-weight:1000;max-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edit-dp{position:absolute;right:-1px;bottom:-1px;width:18px;height:18px;border:0;border-radius:50%;background:#fff;color:#0c3b72;font-size:10px;padding:0;font-weight:1000}

.board-area{flex:1;display:grid;place-items:center;padding:7px;min-height:0}
.board{width:min(94vw,855px);height:min(94vw,855px);max-height:calc(100vh - 150px);max-width:calc(100vh - 150px);aspect-ratio:1/1;background:#fff;border:7px solid #132e50;border-radius:12px;overflow:hidden;position:relative;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);box-shadow:0 16px 38px rgba(0,0,0,.48)}
.cell{position:relative;border:1px solid rgba(25,42,64,.25);display:grid;place-items:center}.path{background:#fff}.red{background:#ef454e}.green{background:#24b96a}.yellow{background:#f3c633}.blue{background:#2c63dc}
.home-red{background:#ef454e}.home-green{background:#24b96a}.home-yellow{background:#f3c633}.home-blue{background:#2c63dc}
.center{background:conic-gradient(#24b96a 0 25%,#2c63dc 0 50%,#f3c633 0 75%,#ef454e 0);border:2px solid #173251}
.yard{position:absolute;width:78%;height:78%;left:11%;top:11%;background:rgba(255,255,255,.90);border-radius:14%;box-shadow:inset 0 0 0 4px rgba(255,255,255,.45)}.yard:after{content:"";position:absolute;inset:8%;border-radius:50%;background:rgba(255,255,255,.72)}
.piece{position:absolute;width:72%;height:72%;border-radius:50%;border:3px solid #fff;z-index:5;box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 3px 4px rgba(255,255,255,.35);cursor:pointer}
.piece:after{content:"";position:absolute;width:32%;height:32%;left:20%;top:15%;border-radius:50%;background:rgba(255,255,255,.42)}
.piece.r{background:radial-gradient(circle at 32% 25%,#ff8585,#d91e2d)}.piece.g{background:radial-gradient(circle at 32% 25%,#8af3b5,#159450)}.piece.y{background:radial-gradient(circle at 32% 25%,#fff09b,#d9a800)}.piece.b{background:radial-gradient(circle at 32% 25%,#87b6ff,#194ab9)}
.lfoot{height:78px;min-height:78px;padding:8px 13px;background:#0a2550;display:flex;align-items:center;justify-content:space-between;gap:10px}
.info{font-size:12px;color:#c8e8ff;font-weight:800;max-width:65%}.roll{border:0;border-radius:15px;padding:13px 23px;background:linear-gradient(#58eaff,#1575dc);color:#fff;font-weight:1000;font-size:18px;box-shadow:0 5px 0 #07529e}.roll:disabled{opacity:.45}

.profile-modal{position:absolute;inset:0;background:rgba(0,0,0,.68);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}.profile-modal.show{display:flex}
.profile-box{width:min(88vw,360px);background:#0d2e5c;border:2px solid #4d80b9;border-radius:22px;padding:20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.profile-preview{width:100px;height:100px;margin:5px auto 14px;border-radius:50%;background:#173b68;border:4px solid #fff;display:grid;place-items:center;overflow:hidden;font-size:38px}.profile-preview img{width:100%;height:100%;object-fit:cover}
.profile-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.profile-actions button,.close-profile{border:0;border-radius:12px;padding:10px 14px;font-weight:900;color:#fff;background:#1777d8}.profile-actions .remove{background:#d93b49}.close-profile{background:#244a77;margin-top:12px}.profile-input{display:none}
.chat-area{height:52px;min-height:52px;background:#071d40;border-top:1px solid #315a8d;display:flex;align-items:center;gap:7px;padding:6px 9px}
.chat-input{flex:1;min-width:0;border:1px solid #426b9a;background:#102f5a;color:#fff;border-radius:15px;padding:9px 11px;outline:none}.chat-input::placeholder{color:#a8c8e7}
.chat-btn{width:38px;height:38px;border:0;border-radius:50%;background:#173f73;color:#fff;font-size:18px}.voice-btn{background:#18a86a}.emoji-btn{background:#6b50c8}
.chat-bubble{position:absolute;bottom:132px;left:12px;right:12px;background:rgba(4,16,37,.92);border:1px solid #3f6796;border-radius:15px;padding:8px 11px;font-size:12px;font-weight:800;display:none;z-index:40}.chat-bubble.show{display:block}
.toast{position:absolute;left:50%;top:72px;transform:translateX(-50%);background:rgba(0,0,0,.78);padding:9px 15px;border-radius:20px;font-size:12px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;z-index:150}.toast.show{opacity:1}
@media(max-width:420px){.topbar{height:62px;min-height:62px}.wallet span{padding:6px 7px}.brand{font-size:21px}.game{height:190px}.art{height:130px}.card-title{font-size:22px}.lfoot{height:72px;min-height:72px}.info{font-size:11px}}
</style>
</head>

<body>

<section id="splash" class="screen active">
  <div class="splash-glow"></div>
  <div>
    <div class="splash-logo">
      <span class="one">ONE</span>
      <span class="soul">SOUL</span>
    </div>
    <div class="splash-sub">PLAY • CONNECT • ENJOY</div>
  </div>
  <div class="loading"><i></i></div>
</section>

<section id="home" class="screen">
  <div class="topbar">
    <div class="brand">ONE <b>SOUL</b></div>
    <div class="wallet">
      <span>🪙 19.89K</span>
      <span>💎 0</span>
      <span class="avatar">OS</span>
    </div>
  </div>

  <div class="home">
    <div class="hero">
      <h1>ONE <span>SOUL</span></h1>
      <p>Choose your game</p>
    </div>

    <div class="games">
      <button class="game g-ludo" onclick="openLudo()">
        <div class="art">
          <div class="mini-board">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
        </div>
        <div class="card-title">LUDO</div>
      </button>

      <button class="game g-card" onclick="coming('COLOR CARD')">
        <div class="art"><div class="cards"><i>4</i><i>8</i><i>7</i></div></div>
        <div class="card-title">COLOR CARD</div>
      </button>

      <button class="game g-snake" onclick="coming('SNAKE & LADDER')">
        <div class="art"><div class="snake">🐍</div></div>
        <div class="card-title">SNAKE & LADDER</div>
      </button>

      <button class="game g-more" onclick="coming('MORE GAMES')">
        <div class="art"><div class="more">🎮</div></div>
        <div class="card-title">MORE GAMES</div>
      </button>
    </div>

    <div class="online">👥 Online Player &nbsp; • &nbsp; ONE SOUL</div>

    <button class="start" onclick="openLudo()">▶ START LUDO</button>

    <div class="note">ONE SOUL • Offline playable Ludo demo</div>
  </div>
</section>

<section id="ludo" class="screen">
  <div class="lhead">
    <button class="back" onclick="goHome()">← MENU</button>
    <div class="turn" id="turn">RED TURN</div>
    <div class="dice-small" id="dice">⚀</div>
  </div>

  <div class="player-strip">
    <div class="player-card">
      <div class="dp empty" id="dp0" onclick="openProfile(0)"><img id="img0"></div>
      <button class="edit-dp" onclick="openProfile(0)">✎</button>
      <div class="player-name">RED</div>
    </div>
    <div class="player-card">
      <div class="dp empty" id="dp1" onclick="openProfile(1)"><img id="img1"></div>
      <button class="edit-dp" onclick="openProfile(1)">✎</button>
      <div class="player-name">GREEN</div>
    </div>
    <div class="player-card">
      <div class="dp empty" id="dp2" onclick="openProfile(2)"><img id="img2"></div>
      <button class="edit-dp" onclick="openProfile(2)">✎</button>
      <div class="player-name">YELLOW</div>
    </div>
    <div class="player-card">
      <div class="dp empty" id="dp3" onclick="openProfile(3)"><img id="img3"></div>
      <button class="edit-dp" onclick="openProfile(3)">✎</button>
      <div class="player-name">BLUE</div>
    </div>
  </div>

  <div class="board-area">
    <div class="board" id="board"></div>
  </div>

  <div class="lfoot">
    <div class="info" id="info">Roll the dice. A 6 brings a piece out of HOME.</div>
    <button class="roll" id="rollBtn" onclick="rollDice()">🎲 ROLL</button>
  </div>

  <div class="chat-area">
    <button class="chat-btn emoji-btn" onclick="addEmoji()">😊</button>
    <input class="chat-input" id="chatInput" maxlength="80" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMessage()">
    <button class="chat-btn" onclick="sendMessage()">➤</button>
    <button class="chat-btn voice-btn" onclick="voiceMessage()">🎙</button>
  </div>

  <div class="chat-bubble" id="chatBubble"></div>

  <div class="profile-modal" id="profileModal">
    <div class="profile-box">
      <h3 id="profileTitle">RED PROFILE</h3>
      <div class="profile-preview" id="profilePreview">👤</div>
      <input class="profile-input" id="profileFile" type="file" accept="image/*" onchange="loadProfileImage(event)">
      <div class="profile-actions">
        <button onclick="document.getElementById('profileFile').click()">📷 CHOOSE PHOTO</button>
        <button class="remove" onclick="removeProfileImage()">REMOVE</button>
      </div>
      <button class="close-profile" onclick="closeProfile()">CLOSE</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</section>

<script>
/* =========================
   SCREEN NAVIGATION
========================= */

function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(screen){
    screen.classList.remove('active');
  });
  var target=document.getElementById(id);
  if(target) target.classList.add('active');
}

function openLudo(){
  showScreen('ludo');
  if(!document.getElementById('board').children.length){
    buildBoard();
  }
}

function goHome(){
  showScreen('home');
}

function coming(name){
  showToast(name + ' is coming soon!');
}

/* FIX: START SCREEN -> MAIN MENU */
window.addEventListener('load',function(){
  setTimeout(function(){
    if(document.getElementById('splash').classList.contains('active')){
      showScreen('home');
    }
  },1800);
});

/* =========================
   BOARD
========================= */

function buildBoard(){
  var board=document.getElementById('board');
  board.innerHTML='';

  for(var r=0;r<15;r++){
    for(var c=0;c<15;c++){
      var cell=document.createElement('div');
      cell.className='cell';

      if(r<6 && c<6){
        cell.classList.add('home-red');
        if((r===1||r===4)&&(c===1||c===4)){
          var yard=document.createElement('div');
          yard.className='yard';
          cell.appendChild(yard);
        }
      }else if(r<6 && c>8){
        cell.classList.add('home-green');
        if((r===1||r===4)&&(c===10||c===13)){
          var yard2=document.createElement('div');
          yard2.className='yard';
          cell.appendChild(yard2);
        }
      }else if(r>8 && c<6){
        cell.classList.add('home-yellow');
        if((r===10||r===13)&&(c===1||c===4)){
          var yard3=document.createElement('div');
          yard3.className='yard';
          cell.appendChild(yard3);
        }
      }else if(r>8 && c>8){
        cell.classList.add('home-blue');
        if((r===10||r===13)&&(c===10||c===13)){
          var yard4=document.createElement('div');
          yard4.className='yard';
          cell.appendChild(yard4);
        }
      }else if(r>=6 && r<=8 && c>=6 && c<=8){
        cell.classList.add('center');
      }else{
        cell.classList.add('path');
        if(r===7 && c===1) cell.classList.add('red');
        if(r===1 && c===7) cell.classList.add('green');
        if(r===7 && c===13) cell.classList.add('blue');
        if(r===13 && c===7) cell.classList.add('yellow');
      }

      board.appendChild(cell);
    }
  }
}

/* =========================
   DICE
========================= */

var diceFaces=['⚀','⚁','⚂','⚃','⚄','⚅'];
var currentPlayer=0;
var colors=['RED','GREEN','YELLOW','BLUE'];

function rollDice(){
  var value=Math.floor(Math.random()*6)+1;
  document.getElementById('dice').textContent=diceFaces[value-1];
  document.getElementById('turn').textContent=colors[currentPlayer]+' TURN';

  if(value===6){
    document.getElementById('info').textContent=colors[currentPlayer]+' rolled 6! A piece can come out of HOME.';
  }else{
    document.getElementById('info').textContent=colors[currentPlayer]+' rolled '+value+'.';
  }

  currentPlayer=(currentPlayer+1)%4;
  setTimeout(function(){
    document.getElementById('turn').textContent=colors[currentPlayer]+' TURN';
  },350);
}

/* =========================
   PROFILE / DP
========================= */

var activeProfile=0;

function openProfile(index){
  activeProfile=index;
  document.getElementById('profileTitle').textContent=colors[index]+' PROFILE';

  var img=document.getElementById('img'+index);
  var preview=document.getElementById('profilePreview');

  if(img && img.src && img.style.display==='block'){
    preview.innerHTML='';
    var copy=document.createElement('img');
    copy.src=img.src;
    preview.appendChild(copy);
  }else{
    preview.innerHTML='👤';
  }

  document.getElementById('profileModal').classList.add('show');
}

function closeProfile(){
  document.getElementById('profileModal').classList.remove('show');
}

function loadProfileImage(event){
  var file=event.target.files && event.target.files[0];
  if(!file) return;

  var reader=new FileReader();
  reader.onload=function(e){
    var img=document.getElementById('img'+activeProfile);
    var dp=document.getElementById('dp'+activeProfile);

    img.src=e.target.result;
    img.style.display='block';
    dp.classList.remove('empty');

    var preview=document.getElementById('profilePreview');
    preview.innerHTML='';
    var copy=document.createElement('img');
    copy.src=e.target.result;
    preview.appendChild(copy);

    showToast(colors[activeProfile]+' DP updated');
  };
  reader.readAsDataURL(file);
}

function removeProfileImage(){
  var img=document.getElementById('img'+activeProfile);
  var dp=document.getElementById('dp'+activeProfile);

  img.removeAttribute('src');
  img.style.display='none';
  dp.classList.add('empty');

  document.getElementById('profilePreview').innerHTML='👤';
  document.getElementById('profileFile').value='';
  showToast(colors[activeProfile]+' DP removed');
}

/* =========================
   CHAT
========================= */

function addEmoji(){
  var input=document.getElementById('chatInput');
  input.value += ' 😊';
  input.focus();
}

function sendMessage(){
  var input=document.getElementById('chatInput');
  var message=input.value.trim();
  if(!message) return;

  var bubble=document.getElementById('chatBubble');
  bubble.textContent=message;
  bubble.classList.add('show');
  input.value='';

  setTimeout(function(){
    bubble.classList.remove('show');
  },3000);
}

function voiceMessage(){
  showToast('Voice message is ready for the next update');
}

/* =========================
   TOAST
========================= */

var toastTimer;

function showToast(message){
  var toast=document.getElementById('toast');
  toast.textContent=message;
  toast.classList.add('show');

  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){
    toast.classList.remove('show');
  },1800);
}

/* Build board when page is ready */
document.addEventListener('DOMContentLoaded',function(){
  buildBoard();
});
</script>

</body>
</html>
