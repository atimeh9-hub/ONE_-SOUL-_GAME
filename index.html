
<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONE SOUL LUDO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial;text-align:center;padding:15px}
h1{color:#ffd54a}
#board{width:min(94vw,430px);aspect-ratio:1;margin:20px auto;background:#26364c;border:5px solid #fff;border-radius:50%;position:relative}
.cell{position:absolute;width:6%;height:6%;border-radius:50%;background:#eee;border:1px solid #777;transform:translate(-50%,-50%)}
.token{position:absolute;width:9%;height:9%;border:3px solid white;border-radius:50%;color:white;font-weight:bold;z-index:3;transform:translate(-50%,-50%);cursor:pointer}
.red{background:#e53935}.green{background:#20a050}.yellow{background:#e0b000}.blue{background:#2878e8}
#center{position:absolute;left:35%;top:35%;width:30%;height:30%;border-radius:50%;background:#ffd54a;color:#111;display:grid;place-items:center;font-weight:bold}
#dice{font-size:55px;margin:10px}
button{padding:12px 20px;border:0;border-radius:10px;font-size:17px;font-weight:bold;margin:6px;cursor:pointer}
#roll{background:#ffd54a}
#status{font-size:18px;margin:15px}
#players{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
</style>
</head>
<body>
<h1>🎲 ONE SOUL LUDO 🎲</h1>
<p>ایک ساتھ بیٹھ کر لڈو کھیلیں</p>
<div id="players">
<span class="red">🔴 RED</span>
<span class="green">🟢 GREEN</span>
<span class="yellow">🟡 YELLOW</span>
<span class="blue">🔵 BLUE</span>
</div>
<div id="board">
<div id="center">ONE<br>SOUL</div>
</div>
<div id="dice">🎲</div>
<button id="roll" onclick="rollDice()">ڈائس چلائیں</button>
<div id="status">ریڈ کی باری ہے</div>
<button onclick="location.reload()">نئی گیم</button>

<script>
const colors=["red","green","yellow","blue"];
const names=["ریڈ","گرین","ییلو","بلیو"];
const starts=[0,13,26,39];
let turn=0,dice=0,waiting=false;
let pieces=colors.map(()=>[-1,-1,-1,-1]);
const board=document.getElementById("board");
const cells=[];
const safe=[0,8,13,21,26,34,39,47];

for(let i=0;i<52;i++){
 let a=(i*2*Math.PI/52)-Math.PI/2;
 let x=50+43*Math.cos(a),y=50+43*Math.sin(a);
 let c=document.createElement("div");
 c.className="cell";
 c.style.left=x+"%";c.style.top=y+"%";
 board.appendChild(c);cells.push({x,y});
}
function position(token,player,index){
 if(index===-1){
  let centers=[[24,24],[76,24],[76,76],[24,76]];
  let offsets=[[0,0],[8,0],[0,8],[8,8]];
  return [centers[player][0]+offsets[token][0]-4,
          centers[player][1]+offsets[token][1]-4];
 }
 if(index>=52)return [50,50];
 let p=cells[(starts[player]+index)%52];
 return [p.x,p.y];
}
function draw(){
 document.querySelectorAll(".token").forEach(e=>e.remove());
 pieces.forEach((group,p)=>{
  group.forEach((step,t)=>{
   let [x,y]=position(t,p,step);
   let b=document.createElement("button");
   b.className="token "+colors[p];
   b.textContent=t+1;
   b.style.left=x+"%";b.style.top=y+"%";
   b.onclick=()=>move(p,t);
   board.appendChild(b);
  });
 });
}
function rollDice(){
 if(waiting)return;
 dice=Math.floor(Math.random()*6)+1;
 document.getElementById("dice").textContent=
 ["","⚀","⚁","⚂","⚃","⚄","⚅"][dice];
 waiting=true;
 document.getElementById("status").textContent=
 names[turn]+" کی باری — گوٹی منتخب کریں";
}
function move(p,t){
 if(!waiting||p!==turn)return;
 let old=pieces[p][t];
 if(old===-1&&dice!==6)return;
 let next=old===-1?0:old+dice;
 if(next>52)return;
 pieces[p][t]=next;
 if(next<52){
  let square=(starts[p]+next)%52;
  if(!safe.includes(square)){
   pieces.forEach((group,op)=>{
    if(op!==p)group.forEach((step,k)=>{
     if(step>=0&&step<52&&
       (starts[op]+step)%52===square){
       pieces[op][k]=-1;
     }
    });
   });
  }
 }
 draw();
 waiting=false;
 if(pieces[p].every(v=>v===52)){
  document.getElementById("status").textContent=
  "🏆 "+names[p]+" جیت گیا!";
  waiting=true;return;
 }
 if(dice!==6)turn=(turn+1)%4;
 document.getElementById("status").textContent=
 names[turn]+" کی باری ہے";
}
draw();
</script>
</body>
</html>
