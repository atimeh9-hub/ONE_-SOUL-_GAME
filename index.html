
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#06194d">
<title>ONE SOUL — 3D Ludo</title>
<style>
:root{--navy:#061747;--cyan:#00d9ff;--gold:#ffd52e;--red:#f3263e;--green:#10c94c;--yellow:#ffc400;--blue:#168dff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 25%,#1763dc 0,#082d83 42%,#020b2b 100%);color:white;font-family:Arial,system-ui,sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer;color:white;border:0}
.app{max-width:760px;margin:auto;padding:10px 10px 22px}
.header{height:70px;display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:7px}
.menu{position:absolute;left:0;top:8px;border:2px solid #73eaff;border-radius:12px;background:linear-gradient(#1677e8,#061e66);font-size:25px;padding:7px 13px;box-shadow:0 0 12px #00cfff}
.logo{font-size:clamp(27px,7vw,45px);font-weight:1000;letter-spacing:1px;color:#ffdc39;-webkit-text-stroke:1px #8d3500;text-shadow:0 3px 0 #732400,0 0 13px #00dfff}
.logo small{font-size:.65em}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:5px 0 10px}
.player{--pc:#fff;display:flex;align-items:center;gap:7px;min-width:0;padding:7px;border:2px solid var(--pc);border-radius:19px;background:linear-gradient(130deg,#123d9c,#04143e);box-shadow:0 0 12px color-mix(in srgb,var(--pc),transparent 40%);min-height:74px}
.player.active{box-shadow:0 0 0 2px white,0 0 22px var(--pc);background:linear-gradient(130deg,#2458c5,#071b51)}
.avatar{width:54px;height:54px;flex:0 0 54px;border-radius:50%;border:3px solid white;background:radial-gradient(circle at 30% 20%,#fff,#8ecbff 65%,#1260ba);display:grid;place-items:center;font-size:27px;overflow:hidden;box-shadow:0 0 10px var(--pc);cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.info{min-width:0;flex:1}
.name{font-weight:900;font-size:clamp(11px,3vw,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.status{font-size:11px;color:#7dffc0;margin-top:5px}
.turn{font-size:10px;color:#ffe56b;font-weight:900;margin-top:2px}
.die{width:53px;height:53px;flex:0 0 53px;border-radius:13px;background:linear-gradient(145deg,#fff,#cbdcff);border:3px solid #91eaff;color:#092b75;box-shadow:0 4px 0 #607dbb,0 0 12px #35cfff;display:grid;place-items:center;font-size:34px;font-weight:1000;text-shadow:0 1px white}
.die:disabled{opacity:.55;filter:saturate(.5);cursor:not-allowed}
.active .die{animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 3px white,0 0 23px #00eaff}}
.boardframe{padding:8px;border-radius:24px;background:linear-gradient(145deg,#fff,#9dbce9 35%,#fff);box-shadow:0 0 0 3px #8beaff,0 8px 0 #18396e,0 0 28px #00cfff}
.board{width:100%;aspect-ratio:1;position:relative;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);gap:1px;background:#263d62;border:3px solid #fff;overflow:hidden}
.cell{background:#f5f8ff;position:relative;display:grid;place-items:center;min-width:0;min-height:0}
.cell.path{background:#fff}
.cell.safe:after{content:"★";font-size:clamp(7px,1.8vw,13px);color:#647a9d}
.cell.lane.red{background:#ff9cac}
.cell.lane.green{background:#7ee9ad}
.cell.lane.yellow{background:#ffe58a}
.cell.lane.blue{background:#91d1ff}
.base{position:absolute;width:40%;height:40%;z-index:2;border:3px solid white;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8%;padding:6%;box-shadow:inset 0 0 18px #fff8}
.base.red{left:0;top:0;background:linear-gradient(145deg,#ff4c60,#c90025);border-radius:28% 0 0 0}
.base.green{right:0;top:0;background:linear-gradient(145deg,#32f45b,#008d36);border-radius:0 28% 0 0}
.base.yellow{left:0;bottom:0;background:linear-gradient(145deg,#ffe34b,#eaa900);border-radius:0 0 0 28%}
.base.blue{right:0;bottom:0;background:linear-gradient(145deg,#45baff,#0759d7);border-radius:0 0 28% 0}
.slot{border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff,#dcecff 70%);border:3px solid #fff;box-shadow:0 3px 8px #00184c;display:grid;place-items:center;min-width:0;min-height:0;position:relative}
.pawn{position:absolute;width:90%;height:96%;left:5%;top:2%;border:0;background:transparent;padding:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;filter:drop-shadow(0 3px 2px #00123f99)}
.pawn .head{width:46%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;background:radial-gradient(circle at 30% 22%,#fff8,#fff2 20%,var(--light) 34%,var(--dark) 100%);box-shadow:inset -3px -3px 4px #0005,0 1px 4px #001b55;z-index:2}
.pawn .body{width:82%;height:62%;margin-top:-7%;border:2px solid #fff8;border-radius:48% 48% 28% 28%;background:radial-gradient(ellipse at 35% 20%,#fff9,var(--light) 30%,var(--main) 62%,var(--dark));clip-path:polygon(50% 0,85% 25%,100% 100%,0 100%,15% 25%);box-shadow:inset -4px -3px 5px #0005}
.pawn.red{--main:#ed1735;--light:#ffb5bf;--dark:#8a001b}
.pawn.green{--main:#08bb42;--light:#c5ffcf;--dark:#006b27}
.pawn.yellow{--main:#f4bd00;--light:#fff5ad;--dark:#996500}
.pawn.blue{--main:#0789e9;--light:#c3efff;--dark:#004c9d}
.pawn.selected{filter:drop-shadow(0 0 7px white) drop-shadow(0 0 5px #00eaff);transform:scale(1.12);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.22)}}
.cell .pawn{width:94%;height:98%;left:3%;top:1%}
.cell .pawn .head{width:43%}
.cell .pawn .body{width:78%;height:59%}
.center{position:absolute;left:40%;top:40%;width:20%;height:20%;z-index:3;background:conic-gradient(var(--blue) 0 25%,var(--green) 0 50%,var(--red) 0 75%,var(--yellow) 0);border:2px solid white;display:grid;place-items:center;font-size:clamp(18px,5vw,32px);text-shadow:0 2px 4px #000}
.progress{position:absolute;color:white;text-shadow:0 2px 4px #001a55;font-size:clamp(12px,3vw,21px);font-weight:1000;z-index:4}
.p-red{left:19%;top:20%}
.p-green{right:19%;top:20%}
.p-yellow{left:19%;bottom:20%}
.p-blue{right:19%;bottom:20%}
.turnline{text-align:center;color:#ffe77a;font-size:clamp(14px,3.7vw,20px);font-weight:1000;margin:15px 0 3px}
.hint{text-align:center;color:#bdeaff;font-size:12px;margin-bottom:12px}
.chat{border:3px solid #00bfff;border-radius:22px;padding:10px;background:linear-gradient(145deg,#082d7d,#03123c);box-shadow:0 0 18px #00cfff88}
.chathead{display:flex;align-items:center;justify-content:space-between;font-weight:1000;font-size:20px;margin:2px 4px 8px}
.local{font-size:11px;color:#a9eaff}
.emojis{display:flex;gap:5px;overflow:auto;padding-bottom:7px}
.emojis button{background:linear-gradient(#168ce9,#063c9b);border:2px solid #79dcff;border-radius:12px;padding:7px;font-size:23px;min-width:48px;box-shadow:0 3px 0 #00194e}
.chatrow{display:flex;gap:7px;align-items:center}
.mic,.send{width:54px;height:54px;flex:0 0 54px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#5ff,#0789ff 55%,#0346b5);border:3px solid #8cecff;box-shadow:0 0 12px #00dfff;font-size:25px}
.chatrow input{min-width:0;flex:1;border-radius:28px;border:2px solid #168dff;background:#061d56;color:white;padding:14px;font-size:15px;outline:none}
.chatrow input::placeholder{color:#b7d9ff}
.messages{max-height:120px;overflow:auto;margin-top:8px;font-size:12px}
.message{background:#d8f4ff;color:#08275c;padding:6px 10px;border-radius:12px;margin:4px 0;width:max-content;max-width:90%;font-weight:700}
.message.me{margin-left:auto;background:#ddffc5}
.note{text-align:center;color:#a9dfff;font-size:11px;margin:10px}
</style>
</head>
<body>
<main class="app">
<header class="header">
<button class="menu" onclick="alert('ONE SOUL menu')">☰</button>
<div class="logo">🪽 👑 ONE SOUL 🪽</div>
</header>
