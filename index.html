
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#06194d">
<title>ONE SOUL — Ludo</title>
<style>
:root{--navy:#061747;--cyan:#00d9ff;--gold:#ffd52e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 20%,#1763dc,#082d83 48%,#020b2b);color:#fff;font-family:Arial,system-ui,sans-serif}
button{font:inherit;cursor:pointer;color:#fff;border:0}
.app{max-width:650px;margin:auto;padding:9px 9px 22px}
header{height:58px;display:flex;align-items:center;justify-content:center}
.logo{font-size:clamp(25px,7vw,40px);font-weight:1000;color:#ffdc39;text-shadow:0 3px #732400,0 0 13px #00dfff}
.turnline{text-align:center;color:#ffe77a;font-weight:900;margin:8px 0}
.players{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}
.player{display:flex;align-items:center;gap:7px;min-width:0;padding:7px;border:2px solid var(--c);border-radius:15px;background:linear-gradient(130deg,#123d9c,#04143e);min-height:63px}
.player.active{box-shadow:0 0 0 2px white,0 0 17px var(--c)}
.avatar{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:var(--c);font-size:21px;border:2px solid white}
.pname{font-size:12px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstate{font-size:10px;color:#c5eaff;margin-top:3px}
.die{margin-left:auto;width:44px;height:44px;flex:0 0 44px;border-radius:10px;background:linear-gradient(145deg,#fff,#cbdcff);border:2px solid #91eaff;color:#092b75;font-size:29px;font-weight:1000;box-shadow:0 3px 0 #607dbb}
.die:disabled{opacity:.45}
.boardframe{padding:6px;border-radius:18px;background:linear-gradient(145deg,#fff,#9dbce9);box-shadow:0 0 0 2px #8beaff,0 6px 0 #18396e,0 0 22px #00cfff}
.board{width:100%;aspect-ratio:1;position:relative;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);gap:1px;background:#263d62;border:2px solid white;overflow:hidden}
.cell{background:#f5f8ff;position:relative;display:grid;place-items:center;min-width:0;min-height:0}
.cell.track{background:#fff}
.cell.safe:after{content:"★";font-size:clamp(7px,2vw,13px);color:#657a9b}
.cell.lane.red{background:#ff9cac}
.cell.lane.green{background:#7ee9ad}
.cell.lane.yellow{background:#ffe58a}
.cell.lane.blue{background:#91d1ff}
.base{position:absolute;width:40%;height:40%;z-index:2;border:3px solid white;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8%;padding:7%;box-shadow:inset 0 0 18px #fff8}
.base.red{left:0;top:0;background:linear-gradient(145deg,#ff4c60,#c90025);border-radius:22% 0 0 0}
.base.green{right:0;top:0;background:linear-gradient(145deg,#32f45b,#008d36);border-radius:0 22% 0 0}
.base.yellow{right:0;bottom:0;background:linear-gradient(145deg,#ffe34b,#eaa900);border-radius:0 0 22% 0}
.base.blue{left:0;bottom:0;background:linear-gradient(145deg,#45baff,#0759d7);border-radius:0 0 0 22%}
.slot{border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff,#dcecff 70%);border:2px solid #fff;box-shadow:0 2px 6px #00184c;display:grid;place-items:center;position:relative}
.pawn{width:82%;height:94%;padding:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;filter:drop-shadow(0 2px 2px #00123f);position:relative;z-index:5}
.pawn .head{width:48%;aspect-ratio:1;border-radius:50%;border:1px solid #fff;background:radial-gradient(circle at 30% 22%,#fff,var(--light) 35%,var(--dark));z-index:2}
.pawn .body{width:82%;height:60%;margin-top:-7%;border:1px solid #fff9;border-radius:48% 48% 25% 25%;background:linear-gradient(120deg,var(--light),var(--main) 55%,var(--dark));clip-path:polygon(50% 0,85% 25%,100% 100%,0 100%,15% 25%)}
.pawn.red{--main:#ed1735;--light:#ffb5bf;--dark:#8a001b}
.pawn.green{--main:#08bb42;--light:#c5ffcf;--dark:#006b27}
.pawn.yellow{--main:#f4bd00;--light:#fff5ad;--dark:#996500}
.pawn.blue{--main:#0789e9;--light:#c3efff;--dark:#004c9d}
.pawn.movable{outline:2px solid #00dfff;border-radius:8px;filter:drop-shadow(0 0 5px white);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.16)}}
.base .pawn{width:70%;height:90%}
.center{position:absolute;left:40%;top:40%;width:20%;height:20%;z-index:3;background:conic-gradient(#168dff 0 25%,#10c94c 0 50%,#f3263e 0 75%,#ffc400 0);border:2px solid white;display:grid;place-items:center;font-size:clamp(17px,5vw,30px)}
.controls{text-align:center;margin:12px 0}
#rollMain{padding:12px 24px;border-radius:14px;background:linear-gradient(#19aaff,#0644b4);border:2px solid #9cecff;font-weight:1000;box-shadow:0 4px #06265f}
#rollMain:disabled{opacity:.45}
.hint{text-align:center;color:#c4eaff;font-size:12px;margin:8px}
.win{display:none;text-align:center;margin:10px;padding:12px;border:2px solid #ffe56b;border-radius:14px;background:#173d8c;color:#ffe56b;font-size:22px;font-weight:1000}
#log{text-align:center;color:#d9efff;font-size:12px;min-height:18px;margin:7px}
.reset{display:block;margin:8px auto;background:#8c1736;padding:9px 16px;border-radius:10px}
.chat{margin-top:12px;border:2px solid #00cfff;border-radius:17px;padding:10px;background:linear-gradient(145deg,#082d7d,#03123c);box-shadow:0 0 15px #00cfff66}
.chathead{display:flex;justify-content:space-between;align-items:center;font-weight:1000;margin-bottom:7px}
.chatmessages{height:75px;overflow:auto;background:#04143e88;border-radius:10px;padding:6px;font-size:12px}
.msg{background:#d8f4ff;color:#08275c;padding:6px 9px;border-radius:10px;margin:4px 0;width:max-content;max-width:90%}
.msg.me{margin-left:auto;background:#ddffc5}
.emojirow{display:flex;gap:5px;overflow:auto;margin:7px 0}
.emojirow button{background:#1355aa;border:1px solid #75dcff;border-radius:8px;padding:5px 8px;font-size:19px}
.chatinput{display:flex;gap:6px}
.chatinput input{min-width:0;flex:1;border-radius:20px;border:2px solid #168dff;background:#061d56;color:white;padding:10px}
.chatinput button{border-radius:12px;padding:8px 11px;background:linear-gradient(#19aaff,#0644b4);border:1px solid #9cecff;font-weight:900}
.nameedit{width:100%;max-width:95px;border:1px solid #8cecff;border-radius:6px;background:#061d56;color:white;font-size:11px;padding:3px;margin-top:3px}
@media(max-width:370px){
.player{padding:5px;gap:4px}
.avatar{width:32px;height:32px}
.die{width:38px;height:38px;flex-basis:38px}
.pname{font-size:10px}
}
</style>
</head>
<body>
<main class="app">
<header><div class="logo">🪽 👑 ONE SOUL 🪽</div></header>
<div class="players" id="players"></div>
<div class="turnline" id="turnline">RED ki baari</div>
<div class="boardframe"><div class="board" id="board"></div></div>
<div class="controls"><button id="rollMain">🎲 DICE ROLL</button></div>
<div class="hint">6 par goti bahar niklegi • ★ safe khana hai • finish ke liye exact number chahiye</div>
<div id="log">Dice roll karein.</div>
<div class="win" id="win"></div>
<section class="chat">
<div class="chathead"><span>💬 INBOX / CHAT</span><small>ONE SOUL</small></div>
<div class="chatmessages" id="chatmessages"><div class="msg">Game chat yahan nazar aayegi.</div></div>
<div class="emojirow">
<button type="button" onclick="addEmoji('❤️')">❤️</button>
<button type="button" onclick="addEmoji('😂')">😂</button>
<button type="button" onclick="addEmoji('😍')">😍</button>
<button type="button" onclick="addEmoji('🔥')">🔥</button>
<button type="button" onclick="addEmoji('👏')">👏</button>
<button type="button" onclick="addEmoji('👍')">👍</button>
</div>
<div class="chatinput">
<button type="button" onclick="voiceInput()" title="Voice typing">🎙️</button>
<input id="chattext" placeholder="Message likhein..." maxlength="180">
<button type="button" onclick="sendMessage()">➤</button>
</div>
</section>
<div class="hint">Mic supported browser mein voice typing karega. Chat abhi isi device par local hai.</div>
<button class="reset" onclick="location.reload()">↻ Naya Game</button>
</main>
